---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
# image will be published to ghcr.io/<user>/<name>
name: bazzite-gnome-rocm
# description will be included in the image's metadata
description: This is my personal OS image with kernel downgraded for ROCm support.

# the base image to build on top of (FROM) and the version tag to use
base-image: ghcr.io/ublue-os/bazzite-gnome
image-version: latest # latest is also supported if you want new updates ASAP

# module configuration, executed in order
# you can include multiple instances of the same module
modules:
  - type: files
    files:
      - source: system
        destination: /tmp/system  # Cambiato per evitare conflitti con il percorso esistente

  - type: rpm-ostree
    repos:
      - https://copr.fedorainfracloud.org/coprs/atim/starship/repo/fedora-%OS_VERSION%/atim-starship-fedora-%OS_VERSION%.repo
    install:
      - micro
      - starship
    remove: []

  - type: default-flatpaks
    notify: true # Send notification after install/uninstall is finished (true/false)
    system:
      install:
        - com.brave.Browser # Brave added
        - org.gnome.Loupe
      remove:
        - org.gnome.eog
    user: {} # Also add Flathub user repo, but no user packages

  - type: rpm-ostree
    remove:
      # Removed unnecessary modules for ROCm support
      - bmi260
      - kmod-bmi260
      - kmod-broadcom-wl
      - gpd-fan
      - kmod-gpd-fan
      - kernel-devel-matched
      - kmod-ayaneo-platform
      - ayaneo-platform
      - kmod-ayn-platform
      - ayn-platform
      - kmod-framework-laptop
      - framework-laptop-kmod-common
      - kmod-gcadapter_oc
      - gcadapter_oc
      - kmod-openrazer
      - openrazer-kmod-common
      - kmod-v4l2loopback
      - kmod-wl
      - kvmfr
      - kmod-kvmfr
      - nct6687d
      - kmod-nct6687d
      - ryzen-smu
      - kmod-ryzen-smu
      - v4l2loopback
      - kmod-vhba
      - vhba
      - xone-kmod-common
      - kmod-xone
      - zenergy
      - kmod-zenergy

  - type: rpm-ostree
    install:
      - https://github.com/bazzite-org/kernel-bazzite/releases/download/6.13.7-108.1/kernel-devel-6.13.7-108.bazzite.fc42.x86_64.rpm
      - https://github.com/bazzite-org/kernel-bazzite/releases/download/6.13.7-108.1/kernel-6.13.7-108.bazzite.fc42.x86_64.rpm
      - https://github.com/bazzite-org/kernel-bazzite/releases/download/6.13.7-108.1/kernel-core-6.13.7-108.bazzite.fc42.x86_64.rpm
      - https://github.com/bazzite-org/kernel-bazzite/releases/download/6.13.7-108.1/kernel-modules-6.13.7-108.bazzite.fc42.x86_64.rpm
      - https://github.com/bazzite-org/kernel-bazzite/releases/download/6.13.7-108.1/kernel-modules-core-6.13.7-108.bazzite.fc42.x86_64.rpm
      - https://github.com/bazzite-org/kernel-bazzite/releases/download/6.13.7-108.1/kernel-modules-extra-6.13.7-108.bazzite.fc42.x86_64.rpm
